name: Build and deploy portfolio

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Generate all complete HTML pages from partials
        run: python3 scripts/build_portfolio.py --all

      - name: Validate every generated page, anchor and local asset
        run: python3 scripts/build_portfolio.py --all --check

      - name: Commit generated static pages on master
        run: |
          git add -- index.html
          for config in pages/*/page.json; do
            page="$(basename "$(dirname "$config")")"
            git add -- "$page/index.html"
          done

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: generate all static portfolio pages [skip ci]"
            git push origin HEAD:master
          else
            echo "All generated HTML pages are already current."
          fi

      - name: Prepare clean site for GitHub Pages
        run: |
          mkdir -p _site
          cp index.html CNAME _site/
          cp -R images js _site/
          for config in pages/*/page.json; do
            page="$(basename "$(dirname "$config")")"
            mkdir -p "_site/$page"
            cp "$page/index.html" "_site/$page/index.html"
          done

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
