name: Build and deploy portfolio

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Generate complete HTML
        run: python3 scripts/build_portfolio.py

      - name: Validate generated HTML and all internal links
        run: python3 scripts/build_portfolio.py --check

      - name: Commit generated index.html on master
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build: generate static portfolio homepage [skip ci]"
            git push origin HEAD:master
          else
            echo "Generated index.html is already current."
          fi

      - name: Prepare clean site for GitHub Pages
        run: |
          mkdir -p _site
          cp index.html CNAME _site/
          cp -R images js _site/

      - name: Upload static website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
