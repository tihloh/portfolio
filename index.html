<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Christian Bustamante | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <style>
        html { scroll-behavior: smooth; }
        body { background: radial-gradient(circle at top right, #2563eb22, transparent 30%), radial-gradient(circle at bottom left, #9333ea22, transparent 35%); }
        .glass { background: rgba(255, 255, 255, .05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 8px 40px rgba(0, 0, 0, .08); }
        .glass-hover { transition: .4s; }
        .glass-hover:hover { transform: translateY(-6px); box-shadow: 0 20px 60px rgba(59, 130, 246, .18); }
        .glow { position: fixed; top: 0; right: -250px; width: 800px; height: 800px; background: radial-gradient(circle, rgba(37, 99, 235, .18), transparent); filter: blur(140px); pointer-events: none; z-index: -1; }
        .firefly { position: absolute; font-family: consolas, monospace; font-weight: 100; color: rgba(255, 255, 255, .3); text-shadow: 0 0 12px rgba(59, 130, 246, .2); animation: fade var(--life) ease-in-out; user-select: none; }
        .section-kicker { color: #60a5fa; text-transform: uppercase; letter-spacing: .18em; font-size: .75rem; font-weight: 700; }
        .chip { border: 1px solid rgba(255, 255, 255, .09); background: rgba(255, 255, 255, .04); }
        @keyframes fade { 0% { opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { scrollbar-width: none; }
    </style>
    <script src="js/site.js" defer></script>
</head>
<body class="bg-black text-white overflow-x-hidden">
    <main id="app" aria-live="polite">
        <p class="min-h-screen grid place-items-center text-zinc-400">Loading portfolio…</p>
    </main>
</body>
</html>
